<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphacampus - Atendimento</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Cabeçalho / Logo -->
    <div class="w-full max-w-md text-center mt-6">
        <div class="inline-block p-4 bg-slate-800 rounded-full shadow-lg mb-4 border border-slate-700">
            <i class="fa-solid fa-building text-3xl text-emerald-400"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-wide">Alphacampus</h1>
        <p class="text-sm text-slate-400 mt-1">Escolha uma opção abaixo para falar conosco</p>
    </div>

    <!-- Lista de Opções / Links -->
    <div class="w-full max-w-md space-y-4 my-8">
        
        <!-- Opção Geral: WhatsApp Alphacampus -->
        <a href="https://wa.me/55NUMERODOWHATSAPP" target="_blank" 
           class="flex items-center justify-between p-4 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl shadow-md transition-all duration-200 transform hover:-translate-y-0.5">
            <div class="flex items-center space-x-3">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>WhatsApp Principal (Alphacampus)</span>
            </div>
            <i class="fa-solid fa-chevron-right text-sm"></i>
        </a>

        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-400 uppercase tracking-wider font-semibold">Fale com um consultor</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <!-- Consultor 1 -->
        <a href="https://wa.me/55NUMERODOCONSULTOR1?text=Olá%20Nome%201,%20vim%20pelo%20QR%20Code%20da%20Alphacampus" target="_blank" 
           class="flex items-center justify-between p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl shadow-md transition-all duration-200 transform hover:-translate-y-0.5">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold">
                    N1
                </div>
                <div>
                    <p class="font-semibold">Nome 1</p>
                    <p class="text-xs text-slate-400">Consultor(a)</p>
                </div>
            </div>
            <i class="fa-brands fa-whatsapp text-emerald-400 text-xl"></i>
        </a>

        <!-- Consultor 2 (Caso queira adicionar mais um) -->
        <a href="https://wa.me/55NUMERODOCONSULTOR2?text=Olá%20Nome%202,%20vim%20pelo%20QR%20Code%20da%20Alphacampus" target="_blank" 
           class="flex items-center justify-between p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl shadow-md transition-all duration-200 transform hover:-translate-y-0.5">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold">
                    N2
                </div>
                <div>
                    <p class="font-semibold">Nome 2</p>
                    <p class="text-xs text-slate-400">Consultor(a)</p>
                </div>
            </div>
            <i class="fa-brands fa-whatsapp text-emerald-400 text-xl"></i>
        </a>

    </div>

    <!-- Rodapé -->
    <footer class="w-full max-w-md text-center text-xs text-slate-500 mb-2">
        &copy; 2026 Alphacampus. Todos os direitos reservados.
    </footer>

</body>
</html>
